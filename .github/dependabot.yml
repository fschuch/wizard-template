version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "jupyter-book"
        update-types: ["version-update:semver-major"]
    groups:
      pip-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
